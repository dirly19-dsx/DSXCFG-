name: Build DSXCFG APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 7.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.6

    - name: Build APK
      run: gradle wrapper --gradle-version 7.6 && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DSXCFG-APK
        path: app/build/outputs/apk/debug/app-debug.apk
